name: Cross-Platform Syntax & Lint Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  windows-powershell:
    name: Windows PowerShell Validation
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate PowerShell Script Syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("BetaTester.ps1", [ref]$tokens, [ref]$errors)
          [System.Management.Automation.Language.Parser]::ParseFile("install-deps.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "✅ All PowerShell scripts validated successfully!"

  linux-bash:
    name: Linux Bash Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate Bash Script Syntax
        run: |
          bash -n betatester.sh
          bash -n install-deps.sh
          echo "✅ All Bash scripts validated successfully!"

      - name: Install ShellCheck & jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Validate JSON schema with jq
        run: |
          jq . config.example.json >/dev/null
          echo "✅ config.example.json is valid JSON!"

      - name: Run ShellCheck on Bash scripts
        run: |
          shellcheck -e SC2086,SC2181,SC2206,SC2034,SC2155 betatester.sh
          shellcheck -e SC2086 install-deps.sh
          echo "✅ ShellCheck passed cleanly!"
